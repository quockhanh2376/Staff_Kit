[features]
multi_agent = true

[agents]
# Keep headroom for the main thread plus the named support agents.
max_threads = 6
# Prevent recursive fan-out and keep delegation shallow.
max_depth = 1
# Default timeout for longer research or coordination jobs.
job_max_runtime_seconds = 1800

[mcp_servers.headroom]
# Runtime wrapper resolves this command to the project-local executable.
command = "headroom"
args = ["mcp", "serve"]
enabled_tools = [
  "headroom_stats",
  "headroom_compress",
  "headroom_retrieve",
]

[mcp_servers.headroom.tools.headroom_stats]
approval_mode = "approve"

[mcp_servers.headroom.tools.headroom_compress]
approval_mode = "approve"

[mcp_servers.headroom.tools.headroom_retrieve]
approval_mode = "approve"
