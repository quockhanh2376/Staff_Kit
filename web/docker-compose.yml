services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetdesk_pro}
      POSTGRES_USER: ${POSTGRES_USER:-assetdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assetdesk_dev_password}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetdesk} -d ${POSTGRES_DB:-assetdesk_pro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "56379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-assetdesk}:${POSTGRES_PASSWORD:-assetdesk_dev_password}@db:5432/${POSTGRES_DB:-assetdesk_pro}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-long-random-secret-value}
      SEED_SUPER_ADMIN_USERNAME: ${SEED_SUPER_ADMIN_USERNAME:-adman}
      SEED_SUPER_ADMIN_DISPLAY_NAME: ${SEED_SUPER_ADMIN_DISPLAY_NAME:-adman}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-ChangeMe-2026!}
      SEED_SUPER_ADMIN_RECOVERY_CODE: ${SEED_SUPER_ADMIN_RECOVERY_CODE:-ADP-DEV-RECOVERY}
      SEED_SUPER_ADMIN_FORCE_PASSWORD_RESET: ${SEED_SUPER_ADMIN_FORCE_PASSWORD_RESET:-false}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres-data:
  redis-data:
